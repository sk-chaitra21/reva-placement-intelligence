
[project]
name = "reva-placement-intelligence"
version = "0.1.0"
description = "Evidence-grounded placement knowledge engine for REVA University"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "google-genai",
    "PyJWT>=2.10,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "email-validator>=2.2,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pgvector>=0.4.1,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
